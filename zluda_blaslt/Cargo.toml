[package]
name = "zluda_blaslt"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "cublaslt"

[dependencies]
cuda_macros = { path = "../cuda_macros" }
cuda_types = { path = "../cuda_types" }
hip_runtime-sys = { path = "../ext/hip_runtime-sys" }
hipblaslt-sys = { path = "../ext/hipblaslt-sys" }
zluda_common = { path = "../zluda_common" }

# VEGA-PATCH 2026-06-28 sprint-orch v2 cublasLt-10: cublasLt64_12.dll spostato in sotto-crate zluda_blaslt12
[package.metadata.zluda]
linux_symlinks = ["libcublasLt.so", "libcublasLt.so.13"]
windows_paths = ["cublasLt64_13.dll"]

[target.'cfg(windows)'.dependencies]
zluda_windows = { path = "../zluda_windows" }
