# VEGA-PATCH 2026-06-28 sprint-orch v2 cublasLt-10: scaffold sotto-crate per cublasLt64_12.dll torch 2.4+
[package]
name = "zluda_blaslt12"
version = "0.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "cublaslt12"

[dependencies]
cuda_macros = { path = "../cuda_macros" }
cuda_types = { path = "../cuda_types" }
hip_runtime-sys = { path = "../ext/hip_runtime-sys" }
hipblaslt-sys = { path = "../ext/hipblaslt-sys" }
zluda_common = { path = "../zluda_common" }

[package.metadata.zluda]
linux_symlinks = ["libcublasLt.so.12"]
windows_paths = ["cublasLt64_12.dll"]

[target.'cfg(windows)'.dependencies]
zluda_windows = { path = "../zluda_windows" }
